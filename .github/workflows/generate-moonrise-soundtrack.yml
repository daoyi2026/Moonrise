name: Generate Moonrise soundtrack

on:
  push:
    branches:
      - add-synced-moonrise-audio
    paths:
      - scripts/generate_moonrise_soundtrack.py
      - .github/workflows/generate-moonrise-soundtrack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate 87.55 second soundtrack
        run: python scripts/generate_moonrise_soundtrack.py

      - name: Commit generated soundtrack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/experiences/galaxy/audio/moonrise.m4a
          if git diff --cached --quiet; then
            echo "Soundtrack is already up to date."
            exit 0
          fi
          git commit -m "Add generated Moonrise soundtrack"
          git push origin HEAD:${GITHUB_REF_NAME}
