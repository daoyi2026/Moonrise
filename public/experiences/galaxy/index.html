<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020a1b" />
    <title>Moonrise — Galaxy</title>
    <style>
      :root {
        color-scheme: dark;
        background: #020a1b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #020a1b;
      }

      body {
        overflow-x: hidden;
      }

      canvas {
        display: block;
      }

      .experience-exit {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        right: max(18px, env(safe-area-inset-right));
        z-index: 10;
        display: none;
        width: 42px;
        height: 42px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.32);
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.86);
        background: rgba(2, 10, 27, 0.34);
        backdrop-filter: blur(10px);
        cursor: pointer;
        font: 300 24px/1 system-ui, sans-serif;
      }

      .experience-exit:hover,
      .experience-exit:focus-visible {
        border-color: rgba(255, 255, 255, 0.65);
        background: rgba(2, 10, 27, 0.58);
        outline: none;
      }

      body.is-embedded .experience-exit {
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <button class="experience-exit" type="button" aria-label="Exit galaxy experience">×</button>

    <script src="../../vendor/p5/p5.min.js"></script>
    <script src="./sketch.js"></script>
    <script>
      (() => {
        const embedded = window.parent !== window;

        if (embedded) {
          document.body.classList.add("is-embedded");
          document.querySelector(".experience-exit").addEventListener("click", () => {
            window.parent.postMessage("exit-galaxy", window.location.origin);
          });
        }

        const observer = new MutationObserver(() => {
          if (!document.querySelector("canvas")) return;
          observer.disconnect();
          if (embedded) {
            window.parent.postMessage("galaxy-ready", window.location.origin);
          }
        });

        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
